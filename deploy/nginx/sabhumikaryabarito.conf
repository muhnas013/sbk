# ---------------------------------------------------------------------------
# Vhost nginx untuk website PT Sabhumi Karya Barito.
#
# Pasang di server yang sudah menjalankan nginx (mis. server-app2):
#   sudo cp deploy/nginx/sabhumikaryabarito.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/sabhumikaryabarito.conf \
#              /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Sertifikat: sesuaikan path di bawah dengan cara penerbitan yang dipakai
# server ini (certbot, acme.sh, atau Cloudflare Origin Certificate).
# ---------------------------------------------------------------------------

upstream sbk_app {
    server 127.0.0.1:3100;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name sabhumikaryabarito.com www.sabhumikaryabarito.com;

    # Sisakan jalur ACME bila sertifikat diterbitkan dengan certbot webroot.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://sabhumikaryabarito.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.sabhumikaryabarito.com;

    ssl_certificate     /etc/letsencrypt/live/sabhumikaryabarito.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sabhumikaryabarito.com/privkey.pem;

    # Satu domain kanonik saja, supaya mesin pencari tidak melihat konten ganda.
    return 301 https://sabhumikaryabarito.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name sabhumikaryabarito.com;

    ssl_certificate     /etc/letsencrypt/live/sabhumikaryabarito.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sabhumikaryabarito.com/privkey.pem;

    # --- Security header (prd.md §8.3) ---
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    server_tokens off;

    # Unggahan CV pelamar dan media bisa mencapai beberapa MB.
    client_max_body_size 12m;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Aset Next.js sudah ber-hash pada nama berkasnya, aman di-cache permanen.
    location /_next/static/ {
        proxy_pass http://sbk_app;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location /api/media/file/ {
        proxy_pass http://sbk_app;
        add_header Cache-Control "public, max-age=2592000" always;
    }

    location / {
        proxy_pass http://sbk_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # Dibaca aplikasi untuk rate limiting form dan notifikasi login.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_read_timeout 60s;
    }
}
