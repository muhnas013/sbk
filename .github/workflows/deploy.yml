name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ke VPS
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30

    steps:
      - name: Periksa kelengkapan secrets
        id: guard
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          # Tanpa penjaga ini, workflow gagal setiap kali sampai server
          # disiapkan — kegagalan rutin membuat orang berhenti memperhatikan CI.
          if [ -z "$SSH_HOST" ] || [ -z "$SSH_USER" ] || [ -z "$SSH_PRIVATE_KEY" ] || [ -z "$DEPLOY_PATH" ]; then
            echo "::notice::Secrets deploy belum lengkap — langkah deploy dilewati."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.guard.outputs.ready == 'true'
        uses: actions/checkout@v5

      - name: Siapkan kunci SSH
        if: steps.guard.outputs.ready == 'true'
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${{ secrets.SSH_PORT || 22 }}" -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Tarik perubahan & bangun ulang container
        if: steps.guard.outputs.ready == 'true'
        run: |
          ssh -p "${{ secrets.SSH_PORT || 22 }}" \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "set -e
             cd ${{ secrets.DEPLOY_PATH }}
             git fetch --all
             git reset --hard origin/main
             docker compose build app
             docker compose up -d --no-deps app
             docker image prune -f"

      - name: Verifikasi health check
        if: steps.guard.outputs.ready == 'true'
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "https://${{ secrets.SITE_DOMAIN }}/health" > /dev/null; then
              echo "Deploy sehat."
              exit 0
            fi
            sleep 10
          done
          echo "Health check gagal setelah 5 menit." >&2
          exit 1
